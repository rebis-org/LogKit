name: Report
description: Report incorrect or unexpected behavior.
labels: ["kind/bug", "status/todo"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the defect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, self-contained reproduction. Smaller cases are triaged faster.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: logkit-version
    attributes:
      label: LogKit version
      description: Branch, tag, or commit SHA.
    validations:
      required: true
  - type: input
    id: swift-version
    attributes:
      label: Swift toolchain
      description: Output of `swift --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform(s)
      description: Affected platforms.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, stack traces, screenshots, or related issues. Do not paste secrets.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and found no duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
